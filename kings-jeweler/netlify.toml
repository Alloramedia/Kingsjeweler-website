[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 (Turbopack) inlines process.env values into SERVER chunks, which
  # trips Netlify's secrets scanner. Those paths are the serverless function
  # bundle + build cache — never publicly served. Scanning stays enabled for
  # everything else (a real leak into client assets still fails the build).
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**,.next/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache hashed static assets (JS, CSS) — Netlify overrides Next.js headers
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache static assets in /public/ (videos, images, downloads)
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/resources/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
